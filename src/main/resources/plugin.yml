name: VanishEffects
version: '1.1'
main: ru.example.vanisheffects.VanishEffectsPlugin
api-version: '1.20'
description: Ваниш с визуальными эффектами и меню выбора стиля.
authors: [ your-name ]

commands:
  v:
    description: Включить/выключить ваниш или открыть меню выбора эффекта.
    usage: |
      /v — переключить ваниш последним стилем
      /v <fire|bats|lightning|starfall|frost|soul|vortex> [игрок] — включить с конкретным стилем
      /v menu — открыть меню выбора эффекта

permissions:
  vanisheffects.use:
    description: Позволяет использовать /v и /v menu на себе.
    default: op
  vanisheffects.others:
    description: Позволяет применять /v к другим игрокам.
    default: op
  vanisheffects.see:
    description: Позволяет видеть игроков в ваниш-режиме.
    default: op
